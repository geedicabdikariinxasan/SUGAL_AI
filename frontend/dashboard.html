<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUGAL AI</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* LOCK SCREEN (NO BODY SCROLL) */
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #02091f;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* SIDEBAR DRAWER */
        #sidebar {
            position: fixed; left: 0; top: 0; width: 280px; height: 100%;
            background: linear-gradient(180deg, #03133e 0%, #020a25 100%);
            border-right: 1px solid rgba(0, 200, 255, .25);
            padding: 20px; z-index: 100;
            display: flex; flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }
        #sidebar.open { transform: translateX(0); }

        .logo-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo {
            width: 42px; height: 42px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 22px;
            background: linear-gradient(135deg, white, #9deeff);
            box-shadow: 0 0 20px rgba(0, 210, 255, .25);
        }
        .logo-title { font-size: 19px; font-weight: 800; }
        .logo-title span { color: #00d9ff; }
        .logo-subtitle { color: #91a8d0; font-size: 10px; }

        .close-sidebar-btn {
            background: rgba(20, 100, 255, .15); border: 1px solid rgba(0, 200, 255, .3);
            color: #00d9ff; width: 30px; height: 30px; border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px;
        }

        .menu { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
        .menu-btn {
            width: 100%; border: none; outline: none; background: transparent;
            color: #b8c9e8; padding: 11px 14px; border-radius: 12px;
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            text-align: left; transition: .2s; font-size: 13px;
        }
        .menu-btn:hover { background: rgba(20, 120, 255, .15); color: white; }
        .menu-btn.active {
            color: white; background: linear-gradient(100deg, #087cff, #673bff);
            box-shadow: 0 0 20px rgba(20, 121, 255, .25);
        }

        .line { width: 100%; height: 1px; background: rgba(100, 170, 255, .15); margin: 15px 0; }
        .sidebar-bottom { margin-top: auto; }
        .user-box { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(20, 100, 255, .08); }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: bold;
            background: linear-gradient(135deg, #1479ff, #743cff); font-size: 13px;
        }
        .user-name { font-size: 12px; font-weight: bold; }
        .online { display: block; color: #43e6ae; font-size: 9px; margin-top: 1px; }

        .logout-btn { width: 100%; border: none; background: transparent; color: #ff91a0; padding: 8px; text-align: left; cursor: pointer; border-radius: 8px; margin-top: 4px; font-size: 12px; }
        .logout-btn:hover { background: rgba(255, 70, 90, .08); }

        /* HEADER */
        header {
            height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
            background: rgba(2, 11, 40, .95); border-bottom: 1px solid rgba(100, 180, 255, .14); backdrop-filter: blur(15px);
            flex-shrink: 0; z-index: 30;
        }

        #menuToggleBtn {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 10px;
            border: 1px solid #00d9ff; background: rgba(0, 217, 255, 0.1);
            color: #00d9ff; font-size: 20px; cursor: pointer;
        }

        .top-search {
            flex: 1; height: 38px; max-width: 500px; display: flex;
            align-items: center; gap: 8px; padding: 0 14px; border-radius: 30px;
            background: #061945; border: 1px solid rgba(50, 145, 255, .35);
        }
        .top-search input { width: 100%; border: none; outline: none; background: transparent; color: white; font-size: 12px; }

        /* MAIN FLEX WRAPPER */
        .main-wrapper {
            display: flex; flex-direction: column; height: 100%; height: 100dvh; width: 100%; overflow: hidden;
        }

        /* SCROLLABLE MIDDLE CONTAINER */
        #scrollContainer {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; padding: 15px; scroll-behavior: smooth;
        }
        #scrollContainer::-webkit-scrollbar { width: 4px; }
        #scrollContainer::-webkit-scrollbar-thumb { background: rgba(0, 217, 255, 0.2); border-radius: 10px; }

        .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
        .glow1 { width: 300px; height: 300px; right: 5%; top: 10%; background: rgba(0, 90, 255, .15); }
        .glow2 { width: 250px; height: 250px; left: 20%; bottom: 10%; background: rgba(100, 30, 255, .12); }

        /* CHAT BUBBLES */
        .message { max-width: 85%; padding: 12px 16px; margin-bottom: 12px; border-radius: 16px; line-height: 1.5; font-size: 13.5px; word-break: break-word; white-space: pre-wrap; }
        .user-message { margin-left: auto; background: linear-gradient(135deg, #116fff, #653dff); color: white; border-bottom-right-radius: 3px; box-shadow: 0 4px 15px rgba(20, 120, 255, .2); }
        .ai-message { margin-right: auto; background: rgba(7, 35, 82, .9); border: 1px solid rgba(0, 210, 255, .2); color: #e2e8f0; border-bottom-left-radius: 3px; box-shadow: 0 4px 15px rgba(0, 0, 0, .3); }

        /* WELCOME BANNER (ONLY VISIBLE BEFORE CHAT) */
        #welcome {
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; margin: auto;
        }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; color: #56eaff; background: rgba(0, 200, 255, .1); border: 1px solid rgba(0, 220, 255, .35); font-size: 10px; font-weight: bold; }
        .welcome-title { font-size: clamp(24px, 4vw, 38px); font-weight: 900; margin-top: 8px; }
        .welcome-title span { background: linear-gradient(90deg, #258cff, #00e0ff, #8c5cff); -webkit-background-clip: text; color: transparent; }
        .welcome-desc { max-width: 480px; color: #94a3b8; font-size: 12.5px; margin-top: 6px; line-height: 1.5; }

        .robot-box {
            width: 120px; height: 100px; margin: 15px auto; display: flex; align-items: center; justify-content: center;
            border-radius: 40%; background: linear-gradient(145deg, #ffffff, #a6eaff); border: 2px solid #72dcff; font-size: 48px;
            box-shadow: 0 0 30px rgba(0, 190, 255, .35);
        }

        /* INPUT AREA FIXED AT BOTTOM */
        .input-area-wrapper {
            flex-shrink: 0; padding: 10px 15px 14px 15px; background: #02091f; z-index: 20; border-top: 1px solid rgba(100, 180, 255, .1);
        }

        .chat-box {
            width: 100%; max-width: 900px; margin: 0 auto; min-height: 52px; display: flex; align-items: center; padding: 4px 6px 4px 14px;
            border-radius: 25px; border: 1px solid #00d9ff; background: rgba(3, 25, 75, .98);
            box-shadow: 0 0 25px rgba(0, 190, 255, .15);
        }
        .chat-box input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: white; font-size: 13.5px; }
        .send-btn {
            width: 40px; height: 40px; border: none; border-radius: 50%; color: white; font-size: 16px;
            cursor: pointer; background: linear-gradient(135deg, #087cff, #743cff); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .quick-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .quick-btn {
            padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(80, 150, 255, .25);
            color: #bcd0ed; background: rgba(20, 70, 140, .3); cursor: pointer; font-size: 11px; transition: .2s;
        }
        .quick-btn:hover { background: rgba(0, 217, 255, .15); border-color: #00d9ff; color: white; }

        /* OVERLAY */
        #overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .75); backdrop-filter: blur(5px); z-index: 90;
        }
    </style>
</head>

<body>

    <!-- DARK OVERLAY -->
    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- =========================
         SIDEBAR DRAWER
    ========================== -->
    <aside id="sidebar">
        <div class="logo-area">
            <div class="logo-box">
                <div class="logo">🤖</div>
                <div>
                    <div class="logo-title">SUGAL <span>AI</span></div>
                    <div class="logo-subtitle">Your Smart Assistant</div>
                </div>
            </div>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <div class="menu">
            <button class="menu-btn active" onclick="goHome(); toggleSidebar();">
                <span>⌂</span> Home
            </button>
            <button class="menu-btn" onclick="newChat(); toggleSidebar();">
                <span>💬</span> New Chat
            </button>
            <button class="menu-btn" onclick="showHistory(); toggleSidebar();">
                <span>◷</span> Chat History
            </button>
            <button class="menu-btn" onclick="document.getElementById('fileInput').click(); toggleSidebar();">
                <span>⇧</span> Upload Files
            </button>
            <button class="menu-btn" onclick="showTools(); toggleSidebar();">
                <span>✦</span> AI Tools
            </button>
        </div>

        <div class="line"></div>

        <div class="sidebar-bottom">
            <div id="sidebarUserBox" class="user-box">
                <div class="avatar" id="sidebarAvatar">H</div>
                <div>
                    <div class="user-name" id="sidebarUserName">Hassan Abdikariin</div>
                    <span class="online">● Online</span>
                </div>
            </div>
            <button id="sidebarLogoutBtn" class="logout-btn" onclick="logout()">
                ↪ &nbsp; Logout
            </button>
        </div>
    </aside>

    <!-- =========================
         MAIN APPLICATION
    ========================== -->
    <div class="main-wrapper">

        <!-- TOP NAVBAR -->
        <header>
            <button id="menuToggleBtn" onclick="toggleSidebar()" title="Menu">☰</button>

            <div class="top-search">
                <span class="text-cyan-400">⌕</span>
                <input id="topSearch" type="text" placeholder="Ask anything..." onkeydown="handleTopSearch(event)">
            </div>

            <div id="topAuthArea" class="ml-auto flex items-center gap-2"></div>
        </header>

        <!-- SCROLLABLE CONTAINER (WELCOME OR MESSAGES) -->
        <div id="scrollContainer">
            <div class="glow glow1"></div>
            <div class="glow glow2"></div>

            <!-- WELCOME BANNER (Dhuumanaya marka fariin la diro) -->
            <div id="welcome">
                <span class="badge">SUGAL AI</span>
                <h1 class="welcome-title">Hello, <span id="welcomeName">Hassan Abdikariin</span> 👋</h1>
                <p class="welcome-desc">Your AI assistant is ready! Ask questions, code, analyze documents, and more.</p>

                <div class="robot-box">🤖</div>

                <!-- QUICK ACTIONS -->
                <div class="quick-actions" id="quickActions">
                    <button class="quick-btn" onclick="quickMessage('Magaalooyinka ugu waaweyn Soomaaliya ma ii sheegi kartaa?')">💡 Su'aalo Weydii</button>
                    <button class="quick-btn" onclick="quickMessage('Isku qor maqaal kooban oo ku saabsan AI')">✍️ Maqaal Qor</button>
                    <button class="quick-btn" onclick="quickMessage('Koodh Python ah oo calculator ah ii samee')">💻 Koodh Samee</button>
                </div>
            </div>

            <!-- CHAT AREA (DHEXDA AYAA FARIIMAHA KU SOO BAXAYAAN) -->
            <div id="chatArea" class="w-full max-w-3xl mx-auto space-y-3 hidden pb-4">
                <div id="messages" class="space-y-3"></div>
            </div>
        </div>

        <!-- ATTACHED FILE BADGE -->
        <div id="filePreviewBadge" class="hidden px-4 py-1 flex-shrink-0 bg-[#02091f]">
            <div class="flex items-center gap-2 bg-blue-900/70 border border-cyan-400/40 text-cyan-300 px-3 py-1 rounded-xl w-fit text-xs font-semibold mx-auto">
                <span>📄</span>
                <span id="attachedFileName" class="truncate max-w-[200px]">file.pdf</span>
                <button onclick="removeAttachedFile()" class="text-red-400 hover:text-red-300 ml-1">✕</button>
            </div>
        </div>

        <!-- INPUT BOX AT BOTTOM -->
        <div class="input-area-wrapper">
            <form id="chatForm" class="chat-box" onsubmit="sendMessage(event)">
                <span class="text-cyan-400 text-lg mr-2">✦</span>
                <input id="messageInput" type="text" placeholder="Type your question here..." autocomplete="off">
                <button type="submit" class="send-btn" id="sendBtn">➤</button>
            </form>
            <p class="text-center text-[10px] text-slate-500 mt-1.5">Powered by SUGAL AI • Smarter • Faster</p>
        </div>

    </div>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="fileInput" class="hidden" accept=".txt,.pdf,.docx,.doc" onchange="handleFiles(this.files)">

    <!-- HISTORY MODAL -->
    <div id="historyModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#06183d] border border-cyan-500/30 rounded-2xl max-w-md w-full max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-cyan-500/20 flex items-center justify-between">
                <h3 class="font-bold text-sm text-cyan-300">Chat History</h3>
                <button onclick="closeModal('historyModal')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1" id="modalHistoryList"></div>
            <div class="p-3 border-t border-cyan-500/20 bg-[#020a25] flex justify-between items-center">
                <button onclick="clearAllHistory()" class="text-red-400 text-xs font-semibold hover:underline">Clear All</button>
                <button onclick="newChat(); closeModal('historyModal');" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold">+ New Chat</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
